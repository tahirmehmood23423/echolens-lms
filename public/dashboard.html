<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoLens - Dashboard</title>
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div id="gate" class="gate"><img src="/img/logo.png" alt="EchoLens" style="width:120px"><div>Loading your dashboard</div></div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo-pill"><img src="/img/logo.png" alt="EchoLens"></span></div>
    <nav id="nav">
      <a class="nav-item active" data-view="overview"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Overview</a>
      <a class="nav-item" data-view="courses"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/></svg>My courses</a>
      <a class="nav-item" data-view="schedule"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Schedule</a>
      <a class="nav-item" data-view="challenges"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h12l-2 7a4 4 0 0 1-8 0z"/><path d="M12 14v4M8 21h8"/><circle cx="12" cy="8" r="1.6"/></svg>Challenges</a>
      <a class="nav-item" data-view="hackathons"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>Hackathons</a>
      <a class="nav-item" data-view="events"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l3 3 5-5"/></svg>Events</a>
      <a class="nav-item" data-view="leaderboard"><svg class="ic" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Leaderboard</a>
      <a class="nav-item" data-view="announcements"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l14-6v14L3 13z"/><path d="M7 12v5"/></svg>Announcements</a>
      <a class="nav-item" data-view="profile"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
      <a class="nav-item teacher-only" data-view="copilot" style="display:none"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15.6l-1.7-4.6L6 9.3l4.3-1.7z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>AI Copilot</a>
      <div class="nav-group admin-only" style="display:none">Administration</div>
      <a class="nav-item admin-only" data-view="admin-catalogue" style="display:none"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Catalogue &amp; new course</a>
      <a class="nav-item staff-only" data-view="admin-users" style="display:none"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 14.8c3 0 6 1.7 6 5.2"/></svg>People</a>
      <a class="nav-item staff-only" data-view="admin-analytics" style="display:none"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Analytics &amp; Leads</a>
    </nav>
    <div class="side-foot">EchoLens LMS &middot; v12.0</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button>
        <span class="page-title" id="pageTitle">Overview</span>
      </div>
      <div class="user">
        <span class="streak-chip" id="topStreak" style="display:none"></span>
        <span class="role-pill" id="rolePill">student</span>
        <div style="text-align:right"><div style="font-weight:600;font-size:14px" id="userName">&mdash;</div></div>
        <div class="avatar" id="avatar">E</div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign out</button>
      </div>
    </header>

    <div class="content">
      <section class="view active" id="view-overview"></section>
      <section class="view" id="view-courses"></section>
      <section class="view" id="view-course"></section>
      <section class="view" id="view-task"></section>
      <section class="view" id="view-schedule"></section>
      <section class="view" id="view-challenges"></section>
      <section class="view" id="view-copilot"></section>
      <section class="view" id="view-hackathons"></section>
      <section class="view" id="view-leaderboard"></section>
      <section class="view" id="view-announcements"></section>
      <section class="view" id="view-profile"></section>
      <section class="view" id="view-events"></section>
      <section class="view" id="view-admin-catalogue"></section>
      <section class="view" id="view-admin-users"></section>
      <section class="view" id="view-admin-analytics"></section>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true">
  <div class="modal" id="modalBox">
    <button class="close" onclick="closeModal()" aria-label="Close">&times;</button>
    <h3 id="modalTitle"></h3>
    <div class="form-msg" id="modalMsg"></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/js/coderunner.js"></script>
<script src="/js/dashboard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/js/gem3d.js"></script>
<script src="/js/tilt.js"></script>
</body>
</html>
