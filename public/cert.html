<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoLens - Verified Certificate</title>
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#16233A; --teal:#0FBFA8; --teal-deep:#0A8F7E; --gold:#D9A425;
    --muted:#5B6B84; --line:#E3E9F2; --canvas:#F4F7FB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--canvas); color: var(--navy); min-height: 100vh; padding: 28px 14px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .verify-banner { display: flex; gap: 12px; align-items: center; background: #EAF9F4; border: 1.5px solid #B7E9DA; color: #0A6E5F; border-radius: 14px; padding: 12px 18px; margin-bottom: 18px; font-size: 14px; }
  .verify-banner.bad { background: #FDEEEE; border-color: #F2C6C6; color: #A33; }
  .verify-banner .tick { font-size: 22px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
  .btn { border: 0; border-radius: 999px; padding: 10px 20px; font: 600 14px 'Inter', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-linkedin { background: #0A66C2; color: #fff; }
  .btn-ghost { background: #fff; color: var(--navy); border: 1.5px solid var(--line); }

  .cert { background: #fff; border-radius: 18px; padding: 52px 56px 40px; position: relative; box-shadow: 0 18px 50px rgba(22,35,58,.12); overflow: hidden; }
  .cert::before { content: ''; position: absolute; inset: 14px; border: 2px solid var(--gold); border-radius: 12px; pointer-events: none; }
  .cert::after { content: ''; position: absolute; inset: 20px; border: 1px solid #EAD9A6; border-radius: 9px; pointer-events: none; }
  .c-band { position: absolute; top: 0; left: 0; right: 0; height: 10px; background: linear-gradient(90deg, var(--teal), #38BDF8, #7C6CF5); }
  .c-head { text-align: center; margin-bottom: 6px; }
  .c-head img { height: 58px; }
  .c-org { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 650; margin-top: 8px; }
  .c-tag { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .c-title { text-align: center; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 26px 0 6px; }
  .c-line { text-align: center; color: var(--muted); font-size: 14px; }
  .c-name { text-align: center; font-family: 'Fraunces', serif; font-size: 42px; font-weight: 650; margin: 12px 0 4px; }
  .c-reg { text-align: center; font-size: 12.5px; color: var(--muted); font-family: ui-monospace, monospace; }
  .c-course { text-align: center; font-size: 21px; font-weight: 700; margin: 14px auto 4px; max-width: 620px; }
  .c-detail { text-align: center; font-size: 13.5px; color: var(--muted); max-width: 600px; margin: 0 auto; }
  .c-date { text-align: center; font-size: 13.5px; margin-top: 10px; }
  .c-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 44px; flex-wrap: wrap; }
  .sig { flex: 1; min-width: 150px; text-align: center; }
  .sig img { max-height: 54px; max-width: 170px; }
  .sig .line { border-top: 1.5px solid var(--navy); margin: 6px 18px 5px; }
  .sig .who { font-size: 13px; font-weight: 700; }
  .sig .role { font-size: 11.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .qr { text-align: center; min-width: 130px; }
  .qr #qrbox { display: inline-block; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .qr .s { font-size: 10.5px; color: var(--muted); margin-top: 5px; }
  .serial { text-align: center; font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--muted); margin-top: 20px; letter-spacing: .08em; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  @media (max-width: 640px) { .cert { padding: 40px 20px 30px; } .c-name { font-size: 30px; } }
  @media print {
    body { background: #fff; padding: 0; }
    .verify-banner, .actions { display: none !important; }
    .cert { box-shadow: none; border-radius: 0; page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <div id="certBox"><div class="empty">Loading certificate&hellip;</div></div>
  <div class="actions" id="actions" style="display:none">
    <button class="btn btn-primary" onclick="window.print()">&#128424; Print / Save as PDF</button>
    <a class="btn btn-linkedin" id="liBtn" target="_blank" rel="noopener">in&nbsp; Add to LinkedIn</a>
    <button class="btn btn-ghost" onclick="navigator.clipboard.writeText(location.href).then(()=>alert('Certificate link copied - share it anywhere.'))">Copy link</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const serial = new URLSearchParams(location.search).get('s');
const KIND_LINE = { course: 'has successfully completed the course', hackathon: 'has successfully participated in the hackathon', competition: 'has successfully competed in' };

(async () => {
  if (!serial) { document.getElementById('certBox').innerHTML = '<div class="empty">No certificate serial in the link.</div>'; return; }
  let d;
  try {
    const res = await fetch('/api/verify/' + encodeURIComponent(serial));
    d = await res.json();
  } catch { d = { valid: false, error: 'Could not reach the verification server.' }; }

  if (!d.valid) {
    document.getElementById('banner').innerHTML = '<div class="verify-banner bad"><span class="tick">&#10007;</span><div><strong>Not verified.</strong> ' + esc(d.error || 'This certificate could not be verified.') + '</div></div>';
    document.getElementById('certBox').innerHTML = '<div class="empty">No valid certificate for serial <strong>' + esc(serial) + '</strong>.</div>';
    return;
  }
  const c = d.certificate;
  const sigSrc = (u) => u ? '/api/public/cert-image/' + encodeURIComponent(u.split('/').pop()) : null;
  const fmt = (x) => { try { return new Date(x + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); } catch { return x; } };

  document.getElementById('banner').innerHTML =
    '<div class="verify-banner"><span class="tick">&#10003;</span><div><strong>Verified authentic.</strong> This certificate was issued by ' + esc(c.org) + ' and is registered under serial <strong>' + esc(c.serial) + '</strong>. Scanning the QR code always returns to this verification page.</div></div>';

  document.getElementById('certBox').innerHTML = `
    <div class="cert">
      <div class="c-band"></div>
      <div class="c-head">
        <img src="/img/logo.png" alt="logo">
        <div class="c-org">${esc(c.org)}</div>
        ${c.tagline ? '<div class="c-tag">' + esc(c.tagline) + '</div>' : ''}
      </div>
      <div class="c-title">Certificate of ${c.kind === 'course' ? 'Completion' : c.kind === 'hackathon' ? 'Participation' : 'Achievement'}</div>
      <div class="c-line">This is to certify that</div>
      <div class="c-name">${esc(c.student_name)}</div>
      ${c.reg_no ? '<div class="c-reg">Registration No. ' + esc(c.reg_no) + '</div>' : ''}
      <div class="c-line" style="margin-top:12px">${KIND_LINE[c.kind] || 'has successfully completed'}</div>
      <div class="c-course">${esc(c.title)}</div>
      ${c.detail ? '<div class="c-detail">' + esc(c.detail) + '</div>' : ''}
      <div class="c-date">Date of completion: <strong>${esc(fmt(c.completion_date))}</strong></div>
      <div class="c-foot">
        <div class="sig">
          ${sigSrc(c.instructor_sig) ? '<img src="' + sigSrc(c.instructor_sig) + '" alt="Instructor signature">' : '<div style="height:54px"></div>'}
          <div class="line"></div>
          <div class="who">${esc(c.instructor_name || 'Course Instructor')}</div>
          <div class="role">Instructor</div>
        </div>
        <div class="qr">
          <div id="qrbox"></div>
          <div class="s">Scan to verify</div>
        </div>
        <div class="sig">
          ${sigSrc(c.ceo_sig) ? '<img src="' + sigSrc(c.ceo_sig) + '" alt="CEO signature">' : '<div style="height:54px"></div>'}
          <div class="line"></div>
          <div class="who">${esc(c.ceo_name || 'Chief Executive Officer')}</div>
          <div class="role">CEO, ${esc(c.org)}</div>
        </div>
      </div>
      <div class="serial">Serial: ${esc(c.serial)} &nbsp;&middot;&nbsp; Issued ${esc(c.issued_at)} &nbsp;&middot;&nbsp; Verify at ${esc(location.host)}/cert?s=${esc(c.serial)}</div>
    </div>`;

  new QRCode(document.getElementById('qrbox'), { text: location.origin + '/cert?s=' + c.serial, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M });

  const y = (c.completion_date || '').slice(0, 4), m = Number((c.completion_date || '').slice(5, 7)) || 1;
  document.getElementById('liBtn').href = 'https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME'
    + '&name=' + encodeURIComponent(c.title)
    + '&organizationName=' + encodeURIComponent(c.org)
    + '&issueYear=' + y + '&issueMonth=' + m
    + '&certUrl=' + encodeURIComponent(location.origin + '/cert?s=' + c.serial)
    + '&certId=' + encodeURIComponent(c.serial);
  document.getElementById('actions').style.display = '';
})();
</script>
</body>
</html>
