<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoLens - Reset password</title>
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v1230">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="/img/logo.png" alt="EchoLens" class="auth-logo">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-sub" id="sub">Choose a new password for your account.</p>
      <div class="form-msg" id="msg"></div>
      <form id="resetForm" autocomplete="off">
        <label class="field"><span>New password</span>
          <input type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label>
        <label class="field"><span>Confirm password</span>
          <input type="password" name="confirm" autocomplete="new-password" required minlength="8" placeholder="Type it again"></label>
        <button type="submit" class="btn btn-primary btn-block" id="submit">Set new password</button>
      </form>
      <p class="auth-foot" id="foot"><a href="/login">Back to sign in</a></p>
    </div>
    <p class="auth-copy">EchoLens &middot; Empowering Pakistan through Artificial Intelligence</p>
  </div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}
function msg(text, ok) {
  const el = $('msg');
  if (!text) { el.className = 'form-msg'; el.textContent = ''; return; }
  el.className = 'form-msg ' + (ok ? 'ok' : 'err'); el.textContent = text;
}
const token = new URLSearchParams(location.search).get('token');
if (!token) {
  $('sub').textContent = 'This reset link is missing its token.';
  $('resetForm').style.display = 'none';
  msg('Use the link from your password reset email, or request a new one from the sign-in page.');
}
$('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target; const btn = $('submit'); btn.disabled = true; msg('');
  if (f.password.value !== f.confirm.value) { msg('Passwords do not match.'); btn.disabled = false; return; }
  try {
    const out = await api('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password: f.password.value }) });
    msg('Password set - signing you in...', true);
    setTimeout(() => { location.href = out.role === 'free' ? '/open' : '/dashboard'; }, 900);
  } catch (err) { msg(err.message); btn.disabled = false; }
});
</script>
</body>
</html>
