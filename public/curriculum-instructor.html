<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoLens - Curriculum grading</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v1400">
<style>
  .cur-wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
  .cur-picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .cur-picker select{padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);font-family:var(--font-body)}
  .cur-queue-item{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);margin-bottom:12px}
  .cur-grade-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .cur-grade-row input[type=number]{width:80px;padding:8px;border-radius:8px;border:1px solid var(--line-strong)}
  .cur-grade-row input[type=text]{flex:1;min-width:200px;padding:8px;border-radius:8px;border:1px solid var(--line-strong)}
  .cur-band{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
  .cur-band.ok{background:#E6F7EF;color:var(--ok)}
  .cur-band.watch{background:#FFF4E0;color:var(--gold)}
  .cur-band.action{background:#FCE8E7;color:var(--danger)}
  .cur-empty{color:var(--muted);font-size:13.5px;padding:16px 0}
</style>
</head>
<body class="grade-page">

<div id="gate" class="gate"><img src="/img/logo.png" alt="EchoLens" style="width:120px"><div>Loading</div></div>

<div id="app" style="display:none">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <span class="logo-pill" style="height:34px"><img src="/img/logo.png" alt="EchoLens" style="height:22px"></span>
      <span class="page-title">Curriculum grading</span>
    </div>
    <div class="user"><a class="btn btn-ghost btn-sm" href="/dashboard">Back to dashboard</a></div>
  </header>
  <div class="content cur-wrap" id="body"></div>
</div>

<div class="toast" id="toast"></div>
<script src="/js/curriculum-instructor.js?v1"></script>
</body>
</html>
